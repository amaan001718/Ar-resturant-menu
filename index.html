<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIGNATURE - AR Menu</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial, sans-serif;
background:#f6f3ee;
color:#222;
}

.header{
background:#111;
color:white;
padding:35px 20px;
text-align:center;
}

.header h1{
margin:0;
font-size:36px;
letter-spacing:5px;
}

.header p{
margin:10px 0 0;
color:#ccc;
font-size:14px;
}

.container{
max-width:600px;
margin:auto;
padding:20px;
}

.search{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
margin-bottom:18px;
outline:none;
}

.categories{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:25px;
}

.categories button{
white-space:nowrap;
border:0;
padding:10px 16px;
border-radius:20px;
background:#ddd;
font-size:14px;
}

.categories button.active{
background:#111;
color:white;
}

.food{
background:white;
border-radius:20px;
margin-bottom:25px;
overflow:hidden;
box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.food-image{
position:relative;
}

.food-image img{
width:100%;
height:230px;
object-fit:cover;
display:block;
}

.badge{
position:absolute;
top:12px;
left:12px;
background:#111;
color:white;
padding:7px 11px;
border-radius:20px;
font-size:12px;
}

.food-content{
padding:18px;
}

.food-title{
display:flex;
justify-content:space-between;
align-items:center;
}

.food-title h2{
margin:0;
font-size:22px;
}

.price{
font-size:20px;
font-weight:bold;
}

.description{
color:#777;
margin:8px 0 15px;
}

model-viewer{
width:100%;
height:300px;
background:#f3f3f3;
border-radius:15px;
}

.ar-button{
background:#111;
color:white;
border:0;
border-radius:10px;
padding:13px 18px;
font-size:15px;
font-weight:bold;
}

.footer{
text-align:center;
padding:30px 10px;
color:#777;
font-size:13px;
}

</style>

</head>

<body>


<header class="header">

<h1>SIGNATURE</h1>

<p>EXPLORE • VIEW • EXPERIENCE</p>

</header>


<main class="container">


<input
class="search"
id="search"
type="text"
placeholder="🔍 Search food..."
>


<div class="categories">

<button class="active" onclick="filterFood('all',this)">
All
</button>

<button onclick="filterFood('starter',this)">
Starters
</button>

<button onclick="filterFood('main',this)">
Main Course
</button>

<button onclick="filterFood('drinks',this)">
Drinks
</button>

</div>


<!-- BURGER -->

<div class="food" data-category="main" data-name="burger">

<div class="food-image">

<img
src="https://i.ibb.co/213NpYQj/360-F-274990113-ff-VRByg-Lk-LCZAATF9l-Wymz-E6b-It-MVu-H1.jpg"
alt="Burger"
>

<span class="badge">
⭐ BEST SELLER
</span>

</div>

<div class="food-content">

<div class="food-title">

<h2>🍔 Burger</h2>

<span class="price">
₹199
</span>

</div>

<p class="description">
Delicious crispy burger
</p>


<model-viewer

src="https://raw.githubusercontent.com/amaan001718/Sig-resturant/main/plaggy_cc0-hamburger-530.glb"

alt="3D Burger"

camera-controls
auto-rotate
ar
ar-modes="webxr scene-viewer quick-look"
ar-placement="floor"
ar-scale="auto">

<button
slot="ar-button"
class="ar-button">

📱 View Burger in AR

</button>

</model-viewer>

</div>

</div>


<!-- PIZZA -->

<div class="food" data-category="main" data-name="pizza">

<div class="food-image">

<img
src="https://i.postimg.cc/TP7FQMfh/360-F-988111369-Px-Mp15v-F2BC4wh-Qx9K5i-Zf-Afof-CABg-AR.jpg"
alt="Pizza"
>

<span class="badge">
🔥 POPULAR
</span>

</div>

<div class="food-content">

<div class="food-title">

<h2>🍕 Pizza</h2>

<span class="price">
₹249
</span>

</div>

<p class="description">
Fresh cheesy pizza
</p>


<model-viewer

src="https://raw.githubusercontent.com/amaan001718/Sig-resturant/main/ergoninane-food-67.glb"

alt="3D Pizza"

camera-controls
auto-rotate
ar
ar-modes="webxr scene-viewer quick-look"
ar-placement="floor"
ar-scale="auto">

<button
slot="ar-button"
class="ar-button">

📱 View Pizza in AR

</button>

</model-viewer>

</div>

</div>


<!-- CHICKEN -->

<div class="food" data-category="starter" data-name="chicken lollipop">

<div class="food-image">

<img
src="https://i.postimg.cc/QdMqmBtz/high-angle-shot-delicious-hot-spicy-dish-called-drums-heaven-table-181624-50861.jpg"
alt="Chicken Lollipop"
>

<span class="badge">
🌶️ SPICY
</span>

</div>

<div class="food-content">

<div class="food-title">

<h2>🍗 Chicken Lollipop</h2>

<span class="price">
₹299
</span>

</div>

<p class="description">
Juicy and delicious chicken lollipop
</p>


<model-viewer

src="https://raw.githubusercontent.com/amaan001718/Sig-resturant/main/quaternius_cc0-chicken-leg-820.glb"

alt="3D Chicken Lollipop"

camera-controls
auto-rotate
ar
ar-modes="webxr scene-viewer quick-look"
ar-placement="floor"
ar-scale="auto">

<button
slot="ar-button"
class="ar-button">

📱 View Chicken in AR

</button>

</model-viewer>

</div>

</div>


</main>


<footer class="footer">

SIGNATURE © 2026<br>
AR MENU

</footer>


<script>

const search = document.getElementById("search");

search.addEventListener("input", function(){

const value = this.value.toLowerCase();

document.querySelectorAll(".food").forEach(function(food){

const name = food.dataset.name;

if(name.includes(value)){

food.style.display = "block";

}else{

food.style.display = "none";

}

});

});


function filterFood(category,button){

document.querySelectorAll(".categories button")
.forEach(function(btn){

btn.classList.remove("active");

});

button.classList.add("active");


document.querySelectorAll(".food")
.forEach(function(food){

if(category === "all" ||
food.dataset.category === category){

food.style.display = "block";

}else{

food.style.display = "none";

}

});

}

</script>


</body>

</html>
