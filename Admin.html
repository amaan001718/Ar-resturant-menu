<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SIGNATURE - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f3ef;
color:#222;
}

.header{
background:#111;
color:white;
padding:25px 18px;
text-align:center;
}

.header h1{
margin:0;
letter-spacing:4px;
}

.header p{
color:#bbb;
margin:8px 0 0;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.refresh{
background:#111;
color:white;
border:0;
padding:11px 16px;
border-radius:10px;
font-weight:bold;
}

.order{
background:white;
border-radius:16px;
padding:18px;
margin-bottom:18px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.order-head{
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
}

.order-id{
font-weight:bold;
font-size:18px;
}

.status{
padding:7px 11px;
border-radius:20px;
font-size:12px;
font-weight:bold;
background:#eee;
}

.status.received{
background:#fff0c2;
}

.status.preparing{
background:#dceeff;
}

.status.ready{
background:#d9f7df;
}

.status.cancelled{
background:#ffdcdc;
}

.customer{
margin:14px 0;
line-height:1.6;
}

.items{
border-top:1px solid #eee;
border-bottom:1px solid #eee;
padding:10px 0;
}

.item{
display:flex;
justify-content:space-between;
padding:5px 0;
}

.total{
font-size:20px;
font-weight:bold;
margin:15px 0;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.actions button{
border:0;
padding:10px 13px;
border-radius:9px;
font-weight:bold;
}

.prepare{
background:#dceeff;
}

.ready{
background:#d9f7df;
}

.cancel{
background:#ffdcdc;
}

.empty{
text-align:center;
padding:50px 20px;
color:#777;
background:white;
border-radius:16px;
}

.error{
background:#ffdcdc;
padding:15px;
border-radius:12px;
margin-bottom:15px;
display:none;
}

</style>

</head>


<body>


<header class="header">

<h1>SIGNATURE</h1>

<p>RESTAURANT ADMIN DASHBOARD</p>

</header>


<main class="container">


<div class="topbar">

<h2>Orders</h2>

<button
class="refresh"
onclick="loadOrders()">

🔄 Refresh

</button>

</div>


<div
id="errorBox"
class="error">
</div>


<div
id="orders">

<div class="empty">

Loading orders...

</div>

</div>


</main>


<script>


const SUPABASE_URL =
"https://wlvfsnlgozlmscmtpvtk.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Eie3jJ8Fz8xUK3LbycqTow_6oo2cWgn";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function loadOrders(){

const container =
document.getElementById("orders");

const errorBox =
document.getElementById("errorBox");

errorBox.style.display =
"none";

container.innerHTML =
'<div class="empty">Loading orders...</div>';


const {data,error} =
await supabaseClient

.from("Orders")

.select("*")

.order("created_at",{
ascending:false
});


if(error){

console.error(error);

errorBox.textContent =
"Error loading orders: " +
error.message;

errorBox.style.display =
"block";

container.innerHTML = "";

return;

}


if(!data || data.length === 0){

container.innerHTML =
'<div class="empty">No orders yet.</div>';

return;

}


container.innerHTML = "";


data.forEach(function(order){

const card =
document.createElement("div");

card.className =
"order";


let itemsHTML = "";


if(Array.isArray(order.items)){

order.items.forEach(function(item){

itemsHTML += `

<div class="item">

<span>
${item.name} × ${item.quantity}
</span>

<strong>
₹${item.price * item.quantity}
</strong>

</div>

`;

});

}


const status =
order.status || "received";


card.innerHTML = `

<div class="order-head">

<div class="order-id">
Order #${order.id}
</div>

<div class="status ${status}">
${status.toUpperCase()}
</div>

</div>


<div class="customer">

👤 <strong>
${order.customer_name || "Unknown"}
</strong>

<br>

🪑 Table:
${order.table_number || "-"}

<br>

🕐
${order.created_at
? new Date(order.created_at)
.toLocaleString()
: "-"}

</div>


<div class="items">

${itemsHTML}

</div>


<div class="total">

Total: ₹${order.total || 0}

</div>


${
order.instructions
?
`<div>
📝 ${order.instructions}
</div>`
:
""
}


<div class="actions">

<button
class="prepare"
onclick="updateStatus(${order.id},'preparing')">

🔵 Preparing

</button>


<button
class="ready"
onclick="updateStatus(${order.id},'ready')">

🟢 Ready

</button>


<button
class="cancel"
onclick="updateStatus(${order.id},'cancelled')">

❌ Cancel

</button>

</div>

`;


container.appendChild(card);

});

}



async function updateStatus(id,status){

const {error} =
await supabaseClient

.from("Orders")

.update({
status:status
})

.eq("id",id);


if(error){

alert(
"Status update failed: " +
error.message
);

return;

}


loadOrders();

}


loadOrders();

</script>


</body>

</html>
